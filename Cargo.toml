[package]
name = "color-codec"
version = "0.1.0"
edition = "2024"
authors = ["Markus Mayer <widemeadows@gmail.com>"]
description = "Experiments in encoding a single sRGB color in as few bits as possible: perceptual binary partitions, gamut-ranked Oklab lattices, and why two coordinates don't help."
license = "EUPL-1.2 OR MIT OR Apache-2.0"
repository = "https://github.com/sunsided/color-codec"
homepage = "https://github.com/sunsided/color-codec"
keywords = ["color", "oklab", "quantization", "compression", "lattice"]
categories = ["multimedia::images", "science", "compression"]
readme = "README.md"
publish = false

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
zstd = "0.13"

[profile.release]
debug = 1
codegen-units = 1
lto = "thin"
